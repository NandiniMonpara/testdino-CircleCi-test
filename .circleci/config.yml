version: 2.1

jobs:
  test:
    docker:
      - image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_directory: ~/project
    parallelism: 4
    environment:
      CI: "true"
    steps:
      - checkout

      - run:
          name: Prepare workspace directories
          command: mkdir -p workspace/blob/$CIRCLE_NODE_INDEX

      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Run Playwright shard
          command: |
            set +e
            npx playwright test --shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL
            status=$?
            echo "$status" > /tmp/playwright-exit-code
            exit 0

      - run:
          name: Collect blob report
          when: always
          command: |
            if [ -d blob-report ]; then
              cp -R blob-report/. workspace/blob/$CIRCLE_NODE_INDEX/
            fi

      - persist_to_workspace:
          root: workspace
          paths:
            - blob

      - store_artifacts:
          path: test-results
          destination: test-results

      - store_test_results:
          path: test-results

      - run:
          name: Fail shard if Playwright failed
          when: always
          command: |
            status=0
            if [ -f /tmp/playwright-exit-code ]; then
              status=$(cat /tmp/playwright-exit-code)
            fi
            exit "$status"

  merge-and-upload:
    docker:
      - image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_directory: ~/project
    environment:
      CI: "true"
    steps:
      - checkout

      - attach_workspace:
          at: workspace

      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Merge Playwright reports to JSON
          command: |
            mkdir -p merged-blob-reports playwright-report
            find workspace/blob -type f -name "*.zip" -exec cp {} merged-blob-reports/ \;
            npx playwright merge-reports --reporter=json merged-blob-reports > playwright-report/report.json

      - run:
          name: Upload results to TestDino
          command: npx tdpw upload ./playwright-report --token="$TESTDINO_TOKEN"

      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  test:
    jobs:
      - test
      - merge-and-upload:
          requires:
            - test:
                - success
                - failed
                - canceled
